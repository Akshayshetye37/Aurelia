name: Build Aurelia Distribution APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore source HTML
        run: |
          mkdir -p app/src/main/assets
          git show 9684a17a5eab09c0fae5909656ce4b39cf9d1080:app/src/main/assets/index.html > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          cp app/src/main/assets/index.html aurelia-hotel-pms-source.html
      - name: Generate signing key
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/aurelia.jks" -storepass "AureliaBuildPass2026!" -keypass "AureliaBuildPass2026!" -alias aurelia -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Aurelia Hotel PMS, O=Aurelia, C=IN"
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Sign and verify
        run: |
          set -e
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          signed=app/build/outputs/apk/release/aurelia-hotel-pms-release.apk
          aligned="$RUNNER_TEMP/aurelia-aligned.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          zipalign=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          test -s "$unsigned"
          "$zipalign" -f 4 "$unsigned" "$aligned"
          "$apksigner" sign --ks "$RUNNER_TEMP/aurelia.jks" --ks-key-alias aurelia --ks-pass "pass:AureliaBuildPass2026!" --key-pass "pass:AureliaBuildPass2026!" --out "$signed" "$aligned"
          "$apksigner" verify --verbose --print-certs "$signed"
          sha256sum "$signed"
      - uses: actions/upload-artifact@v4
        with:
          name: aurelia-distribution-package
          path: |
            app/build/outputs/apk/release/aurelia-hotel-pms-release.apk
            aurelia-hotel-pms-source.html
          if-no-files-found: error
          retention-days: 14
