name: Build Aurelia Signed Release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/aurelia-release.jks" \
            -storepass "${{ secrets.AURELIA_KEYSTORE_PASSWORD || 'TempBuildPass-2026!' }}" \
            -keypass "${{ secrets.AURELIA_KEYSTORE_PASSWORD || 'TempBuildPass-2026!' }}" \
            -alias aurelia-release -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Aurelia Hotel PMS, OU=Android, O=Aurelia, C=IN"
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/aurelia-aligned.apk"
          SIGNED="app/build/outputs/apk/release/aurelia-release.apk"
          STOREPASS="${{ secrets.AURELIA_KEYSTORE_PASSWORD || 'TempBuildPass-2026!' }}"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)"
          test -s "$UNSIGNED"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/aurelia-release.jks" --ks-key-alias aurelia-release --ks-pass "pass:$STOREPASS" --key-pass "pass:$STOREPASS" --out "$SIGNED" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          test -s "$SIGNED"
          sha256sum "$SIGNED"
          ls -lh "$SIGNED"
      - uses: actions/upload-artifact@v4
        with:
          name: aurelia-signed-release-apk
          path: app/build/outputs/apk/release/aurelia-release.apk
          if-no-files-found: error
          retention-days: 14
