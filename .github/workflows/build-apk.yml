name: Build Aurelia Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Akshayshetye37/hotel-pms-v2
          ref: fix/exports-contact-ocr-invoice
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create temporary signing key
        run: |
          mkdir -p android/keystore
          keytool -genkeypair -v -keystore android/keystore/aurelia-build.jks -storepass changeit -keypass changeit -alias aurelia -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Aurelia Build, OU=Android, O=Aurelia, L=Mumbai, ST=Maharashtra, C=IN"
          cat > android/key.properties <<'PROPERTIES'
          storePassword=changeit
          keyPassword=changeit
          keyAlias=aurelia
          storeFile=keystore/aurelia-build.jks
          PROPERTIES
      - run: flutter pub get
      - name: Build release APK without R8 shrink
        run: flutter build apk --release --no-shrink
      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aurelia-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
